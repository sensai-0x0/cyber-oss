name: skills

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".github/scripts/**"
      - ".github/workflows/skills.yml"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".agents/skills/**"
      - ".github/scripts/**"
      - ".github/workflows/skills.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.x"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Test deterministic skill validator
        run: uv run pytest .github/scripts/tests
      - name: Validate metadata, five-skill limit, and acyclic handoffs
        run: uv run python .github/scripts/validate_skills.py .agents/skills
      - name: Package reviewed skill sources
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-hunter-skills
          path: .agents/skills
          if-no-files-found: error
