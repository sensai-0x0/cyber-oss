name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l hunterd enforcerd operator)"
      - run: go vet ./...
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.x"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check orchestrator .github/scripts
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.x"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Test the outline validator
        run: uv run pytest .github/scripts/tests/test_validate_outlines.py
      - name: Check outline links, paths, thresholds, and provenance
        run: uv run python .github/scripts/validate_outlines.py --strict

  lab-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model without starting lab services
        run: FALKORDB_PASSWORD=ci-only docker compose -f deploy/compose.yaml config --quiet
