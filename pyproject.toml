[project]
name = "sentinel-hunter-core"
version = "0.1.0"
description = "LangGraph control plane for Sentinel Hunter"
requires-python = ">=3.11,<3.14"
dependencies = [
  "graphiti>=0.1.13",
  "langchain>=1.5.2",
  "langchain-anthropic>=1.7.12",
  "langgraph>=0.2.60,<2.0",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "pydantic>=2.10,<3.0",
  "PyYAML>=6.0,<7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10.0",
  "jsonschema>=4.23,<5.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
