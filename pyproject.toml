[project]
name = "sentinel-hunter-core"
version = "0.1.0"
description = "LangGraph control plane for Sentinel Hunter"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1.5.2",
  "langchain-anthropic>=1.7.12",
  "langchain-openai>=1.8.5",
  "langgraph>=0.2.60,<2.0",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "pydantic>=2.10,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
# Graph store (plans/graph-store). Not imported by anything yet; install with `uv sync --extra graph`.
graph = [
  "graphiti-core[falkordb,anthropic]>=0.30.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10.0",
  "jsonschema>=4.23,<5.0",
  "ruff>=0.9,<1.0",
  "pytest-cov>=6,<8",
]
graphdb = [
  "graphiti-core[falkordb]>=0.30.2,<0.32",
]

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests", "db/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["orchestrator", "db"]
omit = ["orchestrator/tests/*", "db/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
