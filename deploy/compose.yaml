name: sentinel-hunter-lab

services:
  nats:
    image: nats:2.12-alpine
    command: ["--config", "/etc/nats/nats.conf"]
    ports:
      - "127.0.0.1:14222:4222"
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - ./certs/generated:/etc/nats/certs:ro
    environment:
      NATS_PASSWORD: lab-only-not-for-production

  fake-c2:
    build:
      context: ../lab
    command: ["python", "fake_c2.py", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:18081:8080"
    read_only: true

  phish-panel:
    build:
      context: ../lab
    command: ["python", "phish_panel.py", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:18082:8080"
    read_only: true

  dns:
    image: coredns/coredns:1.13.1
    command: ["-conf", "/etc/coredns/Corefile"]
    ports:
      - "127.0.0.1:15353:53/udp"
    volumes:
      - ./dns:/etc/coredns:ro

  firewall-target:
    image: alpine:3.23
    command: ["sh", "-c", "apk add --no-cache nftables >/dev/null && sleep infinity"]
    cap_add:
      - NET_ADMIN
    network_mode: host
    profiles: ["privileged-lab"]

  # Graph store (plans/graph-store, Phase 1). Opt in with `--profile graph`.
  # No published ports: reachable only by services on graphnet, which is internal.
  falkordb:
    build:
      context: ../.docker/falkordb
    profiles: ["graph"]
    environment:
      REDIS_ARGS: "--requirepass ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD}"
      FALKORDB_ARGS: "THREAD_COUNT 2"
      FALKORDB_PASSWORD: "${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD}"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    networks:
      - graphnet
    cpus: 2
    mem_limit: 1g
    restart: unless-stopped

networks:
  graphnet:
    internal: true

volumes:
  falkordb-data:
