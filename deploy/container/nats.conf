server_name: sentinel-hunter-container
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

authorization {
  user: hunter
  password: $NATS_PASSWORD
}

tls {
  cert_file: /etc/nats/certs/nats-server.crt
  key_file: /etc/nats/certs/nats-server.key
  ca_file: /etc/nats/certs/ca.crt
}

jetstream {
  store_dir: /data/jetstream
  max_mem: 64M
  max_file: 256M
}
